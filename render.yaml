# Render Blueprint — https://render.com/docs/blueprint-spec
# A single Docker web service backed by a free managed Postgres.
# Deploy: push to GitHub, then "New > Blueprint" in Render and pick this repo.

databases:
  - name: pl-sim-db
    plan: free
    databaseName: premier_league
    user: premier_league

services:
  - type: web
    name: pl-sim
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Internal connection string from the managed database above. The
      # container entrypoint runs `migrate up` against this before the server
      # starts, so the schema + seed exist on first boot.
      - key: DATABASE_URL
        fromDatabase:
          name: pl-sim-db
          property: connectionString
      # App listens on $PORT; pin it so it matches the Dockerfile's EXPOSE.
      - key: PORT
        value: "8080"
      - key: MC_ITERATIONS
        value: "10000"
      - key: RANDOM_SEED
        value: "0"
